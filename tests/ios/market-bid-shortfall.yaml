appId: com.matsupiee.wikicollection
---
# 入札可能な出品ID、残高を超える入札額と表示用の不足額を -e で渡す。
- launchApp:
    stopApp: true
- assertVisible: "マーケット"
- openLink: wiki-collection://market/${LISTING_ID}
- tapOn:
    id: "bid-amount"
# iOSの数字キーを直接押し、キーボードを開いたまま「入札」を押せることを確認する。
- evalScript: ${output.digitIndex = 0}
- repeat:
    times: ${String(BID_AMOUNT).length}
    commands:
      - tapOn: "${String(BID_AMOUNT)[output.digitIndex]}"
      - evalScript: ${output.digitIndex++}
- tapOn: "入札"
- assertVisible: ".*あと ${SHORTFALL}pt 必要です。"
- tapOn: "やめる"
- tapOn: "入札"
- tapOn: "pt を購入"
- assertVisible: "ポイント購入"
- waitForAnimationToEnd
- assertNotVisible: "タブバー"
- tapOn: "もどる"
- tapOn: "入札"
- assertVisible: ".*あと ${SHORTFALL}pt 必要です。"
- tapOn: "やめる"
