appId: com.matsupiee.wikicollection
---
# iPhone 17e, portrait. Seed/login prerequisites match opening-juice.yaml.
- stopApp
- openLink: wiki-collection://openings/opening-juice-all-rarities
- tapOn:
    text: "開く"
    optional: true
- tapOn: "パックを選ぶ"
- assertVisible: "封を切る"
- tapOn:
    point: "50%,56%"
- assertVisible: "封を切る"
- swipe:
    start: "50%,56%"
    end: "54%,56%"
    duration: 450
- assertVisible: "封を切る"
- swipe:
    start: "50%,56%"
    end: "53%,68%"
    duration: 600
- assertVisible: "封を切る"
- swipe:
    start: "50%,56%"
    end: "67%,58%"
    duration: 800
- extendedWaitUntil:
    visible: ".*、C、めくる"
    timeout: 12000
- tapOn: "スキップ"
- assertVisible: "開封結果"
- tapOn: "もう1パック"
- assertVisible: "パックを選ぶ"
- tapOn: "スキップ"
- assertVisible: "開封結果"
