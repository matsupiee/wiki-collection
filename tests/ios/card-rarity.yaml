- openLink: wiki-collection://cards/seed-collection-sort-2
- extendedWaitUntil:
    visible: ".*10,000.*"
    timeout: 15000
- assertVisible: "^R$"
- openLink: wiki-collection://cards/seed-collection-sort-1
