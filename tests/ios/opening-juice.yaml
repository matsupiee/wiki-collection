appId: com.matsupiee.wikicollection
---
# Run bun packages/db/src/seed/opening-juice-cli.ts and sign in as opening-juice1@example.com.
- stopApp
- openLink: wiki-collection://openings/opening-juice-all-rarities
- tapOn:
    text: "開く"
    optional: true
- extendedWaitUntil:
    visible: "パックを選ぶ"
    timeout: 15000
- tapOn: "パックを選ぶ"
- assertVisible: "封を切る"
- swipe:
    start: "85%,56%"
    end: "13%,56%"
    duration: 650
- extendedWaitUntil:
    visible: ".*、C、めくる"
    timeout: 12000
- assertNotVisible: ".*、R、めくる"
- swipe:
    start: "55%,47%"
    end: "61%,47%"
    duration: 500
- assertVisible: ".*、C、めくる"
- swipe:
    start: "70%,47%"
    end: "28%,47%"
    duration: 500
- assertVisible: ".*、R、めくる"
- tapOn: "写真の詳細を見る"
- assertVisible: "2 / 2"
- tapOn: "前のカード詳細"
- assertVisible: "1 / 2"
- tapOn: "カードを閉じる"
- tapOn: ".*、R、めくる"
- tapOn: ".*、R、めくる"
- tapOn: ".*、SR、めくる"
- assertVisible: ".*、レジェンド、開封結果を見る"
- swipe:
    start: "70%,47%"
    end: "28%,47%"
    duration: 500
- assertVisible: "開封結果"
- openLink: wiki-collection://openings/opening-juice-skip
- tapOn:
    text: "開く"
    optional: true
- assertVisible: "パックを選ぶ"
- tapOn: "スキップ"
- assertVisible: "開封結果"
